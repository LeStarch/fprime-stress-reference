# fprime-gds.yml: project-local fprime-gds defaults.
#
# fprime-gds auto-loads this file (DEFAULT_CONFIGURATION_PATH =
# Path("fprime-gds.yml")) when invoked from the project root, so
# running plain `fprime-gds` is enough to pick up everything below.
#
# Anything under `command-line-options` is passed to the GDS as CLI
# arguments. Anything under `flask` is set on the Flask `app.config`
# at startup - that is how we swap in the project-local `config.js`
# below, which is what flips dashboards on.
#
# To register the doom-display addon source itself, run
# `lib/fprime-stress/gds-plugin/install.sh` once after installing
# requirements.txt and upgrading to the fprime-gds alpha
# (`pip install fprime-gds==4.2.2a4`; see README). The script copies
# the addon into the active fprime-gds package and appends an import
# to `enabled.js`;
# fprime-gds does not yet expose a CLI flag for out-of-tree addons.
# The Dashboard XML to upload from the browser is at:
#     lib/fprime-stress/gds-plugin/dashboard.xml

command-line-options:
    # ZMQ network layer off - we use the IP-comm path against the
    # deployment binary directly.
    no-zmq:
    # GDS HTML UI on port 5001 (avoids the Flask dev default 5000).
    gui-port: 5001
    # IP socket the deployment binary connects to for uplink/downlink.
    # Bound to loopback: the uplink socket is unauthenticated, so it
    # must not listen on the LAN.
    ip-address: 127.0.0.1
    ip-port: 50100
    # Threaded TCP server (TTS) - fprime-cli command-send target.
    # Loopback-bound for the same reason as ip-address above.
    tts-addr: 127.0.0.1
    tts-port: 50101

flask:
    # Point fprime-gds's `/js/config.js` route at this project's
    # config.js (committed under the GDS-plugin directory next to the
    # dashboard XML it pairs with) instead of the package default.
    # That config.js sets `config.enableDashboards = true`, so the
    # Dashboard tab is visible without mutating the installed
    # fprime-gds site-packages tree.
    #
    # The !PATH tag resolves the value relative to this YAML file's
    # directory; see fprime_gds.executables.cli.ConfigDrivenParser.
    JS_CONFIGURATION_FILE: !PATH lib/fprime-stress/gds-plugin/config.js
