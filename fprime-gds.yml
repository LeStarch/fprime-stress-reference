# fprime-gds.yml: project-local fprime-gds defaults.
#
# fprime-gds loads this file automatically when started from the project
# root. Anything under `command-line-options` is passed to the GDS as
# CLI arguments, so the operator can just run `fprime-gds` without
# spelling out flags. Override any of these on the command line.
#
# To enable the Dashboard tab (and load the doom-display addon), run
# `lib/fprime-stress/gds-plugin/install.sh` once after `pip install -r
# requirements.txt`. That script patches the active fprime-gds package
# so dashboards render and the doom-display custom tag is registered.
# The Dashboard XML to upload is at:
#   lib/fprime-stress/gds-plugin/dashboard.xml
command-line-options:
    # Suppress the auto-launched flight-software companion app
    # (fprime-gds normally tries to start the deployment binary; we
    # launch the binary ourselves so the GDS sees a live downlink).
    no-app:
    # ZMQ network layer off - we use the IP-comm path against the
    # deployment binary directly.
    no-zmq:
    # GDS HTML UI on port 5001 (avoids the Flask dev default 5000).
    gui-port: 5001
    # IP socket the deployment binary connects to for uplink/downlink.
    ip-port: 50100
    # Threaded TCP server (TTS) port - fprime-cli command-send target.
    tts-port: 50101
