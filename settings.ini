; ======================================================================
; fprime-stress-reference settings
;
; This project lives out-of-tree relative to F Prime. It expects the
; F Prime checkout to live at ../fprime and the fprime-stress library
; (Doom component + DoomSubtopology) at ../fprime-stress. Override
; either via cmake command-line options (FPRIME_FRAMEWORK_PATH,
; FPRIME_LIBRARY_LOCATIONS) if your layout differs.
; ======================================================================
[fprime]
framework_path: ../fprime
project_root: .
library_locations: ../fprime-stress
default_cmake_options: FPRIME_SKIP_TOOLS_VERSION_CHECK=ON
