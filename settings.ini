; ======================================================================
; fprime-stress-reference settings
;
; Submodule layout: lib/fprime is the F Prime framework checkout,
; lib/fprime-stress is the library that provides the Doom component
; and DoomSubtopology.
; ======================================================================
[fprime]
project_root: .
framework_path: ./lib/fprime
library_locations: ./lib/fprime-stress

default_cmake_options: FPRIME_SKIP_TOOLS_VERSION_CHECK=ON
